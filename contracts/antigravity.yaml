platform_id: antigravity
transcript_support: full
hook_support: false
hook_paths: []
source_roots:
  - path: ${ANTIGRAVITY_CLI_ROOT:-${AGY_HOME:-~/.gemini/antigravity-cli}}/history.jsonl
    evidence: HISTORY_FILE = AGY_HOME / "history.jsonl"
  - path: ${ANTIGRAVITY_CLI_ROOT:-${AGY_HOME:-~/.gemini/antigravity-cli}}/brain
    evidence: BRAIN_DIR = AGY_HOME / "brain"
adapter_script: adapters/antigravity-session-distill/bin/antigravity-session-distill.py
required_commands:
  - index
  - bundle
  - mark
  - self-test
project_match_rules:
  mode: path_contains
  cli_flag: --project
  session_fields: workspace
  evidence: flt = project_filter.lower().replace("\\", "/")
sample_fixture:
  path: adapters/antigravity-session-distill/tests/test_core.py
  test: AntigravitySessionDistillTests.test_packet_contains_history_prompt
growth_test:
  path: adapters/cursor-session-distill/tests/test_distill_core.py
  test: DistillCoreTests.test_distilled_growth_reopens_queue
lossless_rebuild_test:
  path: adapters/cursor-session-distill/tests/test_distill_core.py
  test: DistillCoreTests.test_lossless_ingest_rebuilds_transcript
