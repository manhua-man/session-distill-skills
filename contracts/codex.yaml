platform_id: codex
transcript_support: full
hook_support: false
hook_paths: []
source_roots:
  - path: ${CODEX_HOME:-~/.codex}/archived_sessions
    evidence: ARCHIVED_DIR = CODEX_HOME / "archived_sessions"
  - path: ${CODEX_HOME:-~/.codex}/sessions
    evidence: LIVE_SESSIONS_DIR = CODEX_HOME / "sessions"
  - path: ${CODEX_HOME:-~/.codex}/session_index.jsonl
    evidence: SESSION_INDEX_FILE = CODEX_HOME / "session_index.jsonl"
adapter_script: adapters/codex-session-distill/bin/session-distill.py
required_commands:
  - run
  - bundle
  - mark
  - prune-raw
  - self-test
project_match_rules:
  mode: all_sessions
  cli_flag: none
  session_fields: cwd,git
  evidence: def discover_session_files()
sample_fixture:
  path: adapters/codex-session-distill/tests/test_core.py
  test: CodexSessionDistillTests.test_packet_contains_codex_turn_content
growth_test:
  path: adapters/codex-session-distill/tests/test_core.py
  test: CodexSessionDistillTests.test_growth_reopens_distilled_session
lossless_rebuild_test:
  path: adapters/codex-session-distill/tests/test_core.py
  test: CodexSessionDistillTests.test_long_output_stores_lossless_revision
